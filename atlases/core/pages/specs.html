<!-- atlases/core/pages/specs.html
     SPECs page — one tab per atlas; for each atlas, a left tree split
     into "Done" + "To-do" sections, right pane renders the selected
     SPEC's markdown body.
     Data: atlases/<aid>/specs/specs_index.json (written by assemble.sh
     via build/index_specs.py). Individual SPEC files live at
     atlases/<aid>/specs/{done,todo}/<file>.md. -->
<div class="core-page core-page-specs">

  <header>
    <h1>SPECs — done and to-do, per atlas</h1>
    <div class="sub">
      One tab per atlas. Each tab lists shipped SPECs and pending SPECs;
      click any row to read the SPEC body. Index is generated by
      <code>build/index_specs.py</code> at assemble time.
    </div>
  </header>

  <div class="spc-tabs" id="spc-tabs">
    <!-- atlas tabs are injected at mount() — one per atlas in atlases/_index.json -->
    <div class="spc-mode" role="group" aria-label="Spec list filter">
      <button class="spc-mode-btn active" data-mode="all"  type="button">All</button>
      <button class="spc-mode-btn"        data-mode="done" type="button">Done</button>
      <button class="spc-mode-btn"        data-mode="todo" type="button">To-do</button>
    </div>
  </div>

  <div class="spc-body">
    <aside class="spc-left">
      <div class="spc-search">
        <input type="search" id="spc-filter" placeholder="filter SPEC…" autocomplete="off">
      </div>
      <div class="spc-tree" id="spc-tree"><div class="spc-empty">loading…</div></div>
    </aside>

    <main class="spc-right">
      <div class="spc-detail" id="spc-detail"><div class="spc-empty">Select a SPEC on the left.</div></div>
    </main>
  </div>

</div>
