# =============================================================================
# atlas master_config.yaml  (site-local, WSL @ /mnt/e/)
# =============================================================================
# Active master_config for THIS machine. Loaded by core/master_config.js in
# preference to master_config.example.yaml.
#
# All read-only roots use ABSOLUTE /mnt/e/... paths pointing directly at the
# results_inversions / results_diversity / results_population / results_genome
# tree we just laid down. The unified server's static mount serves them
# because assemble.sh creates a $WORKSPACE/mnt/e -> /mnt/e symlink (the
# absolute-path mirror) — fetching /mnt/e/X resolves to that symlink.
#
# Cache lives outside the project tree at /mnt/e/atlas-cache.
# =============================================================================

atlas:
  workspace_root: "."
  active_atlas:   "inversion"
  # Use the bare chrom id ("LG28") here, matching the manifest's
  # scope_picker options and the {chrom} placeholder in layer templates.
  # The on-disk filename is species-prefixed (C_gar_LG28.atlas.json) —
  # the species prefix is baked into the layer's path_under_root, not
  # into active_chrom.
  active_chrom:   "LG28"

species:
  - id:     "gariepinus"
    config: "species/gariepinus.config.yaml"
    active: true

# -----------------------------------------------------------------------------
# ROOTS
# -----------------------------------------------------------------------------
# Absolute /mnt/e/ paths. species_scoped: false everywhere for now (single
# species cohort); when macrocephalus data lands, add per-species roots and
# flip species_scoped: true on the ones that need it.
# -----------------------------------------------------------------------------
roots:

  # ----- read-only inputs (Category 1) ---------------------------------------

  beagle:
    path: "/mnt/e/results_inversions/01_beagle"
    role: "intervals"
    species_scoped: false
    description: "main_qcpass.<CHR>.beagle.gz files. Input to popstats compute."

  cohort_dosage:
    path: "/mnt/e/results_inversions/02_dosage_sites"
    role: "intervals"
    species_scoped: false
    description: "Per-chromosome dosage tile store: <chrom>.sites.tsv.gz + <chrom>.dosage.tsv.gz. Read by GET /api/dosage/chunk for the streaming dosage heatmap."

  inversion_theta_pi_pestPG:
    path: "/mnt/e/results_inversions/03_theta_pi_pestPG"
    role: "intervals"
    species_scoped: false
    description: "win10000.step2000 pestPG subset consumed by STEP_TR_A/B (theta-pi local-PCA path). Sourced from results_diversity/03_theta_pi; copied here so the inversion pipeline reads only the scale it actually uses (per the STEP_TR_A/B README, the other 3 scales stay in diversity)."

  clair3_phased_ghsl:
    path: "/mnt/e/results_inversions/04_clair3_phased_GHSL"
    role: "intervals"
    species_scoped: false
    description: "Phased Clair3 VCFs feeding the GHSL inversion-discovery path."

  precomp_zblocks:
    path: "/mnt/e/results_inversions/local_PCA_MDS_z/09_atlas_json"
    role: "intervals"
    species_scoped: false
    description: "Per-chromosome atlas JSONs from the z-blocks local-PCA path. Auto-loaded by atlas pages. Bumped 2026-05-14 from 04_atlas_json to 09_atlas_json (new pipeline output dir). Files are written as C_gar_LG{NN}.atlas.json — the species prefix and .atlas infix are baked into the scrubber_main layer's path_under_root."

  precomp_thetapi:
    path: "/mnt/e/results_inversions/local_PCA_MDS_theta_pi/04_atlas_json"
    role: "intervals"
    species_scoped: false
    description: "Per-chromosome atlas JSONs from the theta-pi local-PCA path. Auto-loaded by atlas pages. Note: theta-pi files are laid out as 04_atlas_json/C_gar_LG{NN}/C_gar_LG{NN}_phase2_theta.json (per-chrom subfolder, distinct from the z-blocks flat layout). The /api/precomp_index endpoint handles both via depth-2 scan, so the scrubber_thetapi layer can stay auto_index: true."

  precomp_ghsl:
    path: "/mnt/e/results_inversions/local_PCA_MDS_GHSL/10_atlas_json"
    role: "intervals"
    species_scoped: false
    description: "Per-chromosome atlas JSONs from the GHSL local-PCA path. Layout mirrors theta-pi: 10_atlas_json/C_gar_LG{NN}/C_gar_LG{NN}_phase3_ghsl.json (per-chrom subfolders). Discovered via /api/precomp_index. Only some chroms produced today — AUTO_INDEX_EMPTY for missing chroms is downgraded to debug per the prewarm scheduler."

  per_chrom_zblocks:
    path: "/mnt/e/results_inversions/local_PCA_MDS_z/03_per_chrom"
    role: "intervals"
    species_scoped: false
    description: "Per-chromosome RDS / sim-mat / envelope outputs for the z-blocks local-PCA path."

  per_chrom_thetapi:
    path: "/mnt/e/results_inversions/local_PCA_MDS_theta_pi/03_per_chrom"
    role: "intervals"
    species_scoped: false
    description: "Per-chromosome outputs for the theta-pi local-PCA path."

  per_chrom_ghsl:
    path: "/mnt/e/results_inversions/local_PCA_MDS_GHSL/03_per_chrom"
    role: "intervals"
    species_scoped: false
    description: "Per-chromosome outputs for the GHSL local-PCA path."

  mds_zblocks:
    path: "/mnt/e/results_inversions/local_PCA_MDS_z/02_mds"
    role: "intervals"
    species_scoped: false
    description: "Genome-wide MDS rollup for the z-blocks path (windows_master.tsv.gz, candidate_regions.tsv.gz)."

  mds_thetapi:
    path: "/mnt/e/results_inversions/local_PCA_MDS_theta_pi/02_mds"
    role: "intervals"
    species_scoped: false
    description: "MDS rollup for the theta-pi path (may be empty by design)."

  mds_ghsl:
    path: "/mnt/e/results_inversions/local_PCA_MDS_GHSL/02_mds"
    role: "intervals"
    species_scoped: false
    description: "MDS rollup for the GHSL path."

  shared:
    path: "/mnt/e/_shared"
    role: "samples"
    species_scoped: false
    description: "Cohort-wide inputs the whole atlas reads (samples.ind, chrom_sizes.tsv, callable_regions.rf, samples_qcpass.txt, bamlist_qcpass.txt, etc.). Used by inversions, diversity, AND population."

  reference:
    path: "/mnt/e/_shared/reference"
    role: "intervals"
    species_scoped: false
    description: "Reference FASTA + index. Filenames declared in species/gariepinus.config.yaml. Top-level shared so all three result trees can read it."

  # ----- diversity, population, genome ---------------------------------------

  # Folder names mirror the producer repo at
  # /mnt/c/Users/quent/Desktop/catfish-diversity-analysis/Modules/.
  diversity_saf_per_sample:
    path: "/mnt/e/results_diversity/01_saf_per_sample"
    role: "samples"
    species_scoped: false
    description: "Per-sample ANGSD SAF outputs (Module 01_saf_per_sample). 226 samples."

  diversity_heterozygosity:
    path: "/mnt/e/results_diversity/02_heterozygosity"
    role: "samples"
    species_scoped: false
    description: "Heterozygosity bundle (Module 02_heterozygosity). Subfolders: 02_sfs/, 04_summary/ (genomewide_heterozygosity.tsv), 05_ancestry_heterozygosity/, 05_single_heterozygosity_boxplot/."

  diversity_theta_pi:
    path: "/mnt/e/results_diversity/03_theta_pi"
    role: "intervals"
    species_scoped: false
    description: "ANGSD -doThetas pestPG outputs (Module 03_theta_pi). 4 scales x 226 samples = 904 .pestPG files. Read by both diversity scans AND the inversion path-2 (theta-pi local-PCA) via the registry."

  diversity_roh:
    path: "/mnt/e/results_diversity/04_roh_summary"
    role: "intervals"
    species_scoped: false
    description: "ROH outputs (Module 04_roh_summary). Per-chrom tree under per_chr/<chrom>/: roh_tracts_all.bed (per-sample ROH segments), catfish_roh.per_sample_roh.tsv (per-sample FROH for that chrom), catfish_roh.per_sample_roh_bins_long.tsv (length-class bins), plus a multiscale/win*/ subtree (4 window scales). 2026-05-26: was /04_roh (empty); repointed to /04_roh_summary where the pipeline actually writes."

  diversity_roh_bundle:
    path: "/mnt/e/results_diversity/MS_BUNDLE_het_roh_2026-04-18/01_final_tables"
    role: "samples"
    species_scoped: false
    description: "Genome-wide ROH + H manuscript bundle (01_final_tables). Single-file cohort aggregates the UI consumers read: per_chr_roh_summary.tsv (sample x chrom F_ROH, 227x28), per_sample_roh.tsv (genome-wide per-sample F_ROH), master_summary.tsv (H + F_ROH + theta-in/out-ROH join), per_sample_het_in_out_roh.tsv. Added 2026-05-26 — the per-chrom 04_roh_summary tree has no pre-built genome-wide aggregate, so the cohort layers source from this bundle while per-chrom tracts source from diversity_roh."

  diversity_aggregated:
    path: "/mnt/e/results_diversity/05_aggregated"
    role: "samples"
    species_scoped: false
    description: "Cross-module rollups (Module 05_aggregated): genome-wide pi/theta tables, sample-level summaries."

  population_natora:
    path: "/mnt/e/results_population/01_natora_pruned"
    role: "samples"
    species_scoped: false
    description: "NAToRA-pruned unrelated subset (e.g. 81 samples)."

  population_ngsrelate:
    path: "/mnt/e/results_population/02_ngsrelate"
    role: "samples"
    species_scoped: false
    description: "Pairwise ngsRelate theta + relatedness summaries."

  population_ngsadmix:
    path: "/mnt/e/results_population/03_ngsadmix"
    role: "samples"
    species_scoped: false
    description: "NGSadmix K=2..20 sweeps (qopt + log-likelihood tables)."

  population_pcangsd:
    path: "/mnt/e/results_population/04_pcangsd"
    role: "samples"
    species_scoped: false
    description: "pcangsd PCA / kinship outputs."

  population_evaladmix:
    path: "/mnt/e/results_population/05_evaladmix"
    role: "samples"
    species_scoped: false
    description: "evalAdmix residuals."

  population_fpw:
    path: "/mnt/e/results_population/06_FPW"
    role: "samples"
    species_scoped: false
    description: "Founder waves (FPW) decomposition."

  pods_results:
    path: "/mnt/e/results_pods"
    role: "intervals"
    species_scoped: false
    description: "PODs (Pseudo-Observed Datasets) — coalescent-simulated null distributions for FST/dXY/theta outlier validation. Owned by pods-atlas (promoted from population-atlas on 2026-05-23 — Phase 1d). Three subdirs: simulations/<cache_key>.tsv (per-replicate per-locus stats), outlier_calls/<cache_key>.tsv (empirical-vs-PODs p-values + significance flags per locus), calibration/<cache_key>.json (model-fit diagnostics)."

  # 2026-05-29: referenced by loads-atlas layers but previously undeclared.
  # Phase-0 stub atlas (mutation/genetic-load tables). Flat root, two TSVs.
  loads_results:
    path: "/mnt/e/results_loads"
    role: "samples"
    species_scoped: false
    description: "Genetic-load tables owned by loads-atlas: load_per_individual.tsv (per-sample mutation load) + load_per_inversion.tsv (per-inversion load). Phase-0 contract-only today — files land when the load pipeline ships."

  genome_assembly:
    path: "/mnt/e/results_genome/01_assembly"
    role: "intervals"
    species_scoped: false
    description: "hifiasm / verkko outputs."

  genome_annotation:
    path: "/mnt/e/results_genome/02_annotation"
    role: "intervals"
    species_scoped: false
    description: "BRAKER, RepeatMasker, etc."

  genome_te_density:
    path: "/mnt/e/results_genome/03_TE_density"
    role: "intervals"
    species_scoped: false
    description: "EDTA outputs and TE density tracks. Reserved for a future per-window TE density layer that doesn't fit the annotation lumped folder. NB 2026-05-23: no atlas layer references it yet (genome's repeat_track + te_hierarchy live under genome_annotation root). The dir IS deliberately created by build/setup_local_dirs.sh:83 as a placeholder for the EDTA pipeline — not an orphan, just unconsumed by the JS side until a per-window TE density page lands."

  genome_synteny:
    path: "/mnt/e/results_genome/04_synteny"
    role: "intervals"
    species_scoped: false
    description: "wfmash + catfish-synteny-toolkit outputs. Within-Cgar collinearity blocks + Oxford grids + ortholog tables. Genome atlas's comparative pages live here; consumed by cross-species as background. The 18-genome cross-species view of similar data lives under cross_species_gene_order."

  genome_conservation:
    path: "/mnt/e/results_genome/05_conservation"
    role: "intervals"
    species_scoped: false
    description: "Conserved-element pipeline outputs (Cactus / phastCons). conserved_elements.bed + downstream UCE/regulatory tracks. Distinct from genome_annotation because the producer pipeline is separate."

  # ----- cross-species, evolution, popstats (Phase 1a 2026-05-23 split) ------
  # Three atlases were split out of inversion-atlas (see docs/MIGRATION_4_ATLASES.md).
  # Their outputs live under /mnt/e/results_cross_species, results_evolution, and
  # results_popstats. Each root corresponds to one producer pipeline; the atlas's
  # layers.registry.json references the root by name and supplies path_under_root
  # for the file pattern. Until each producer physically writes here, the folder
  # may not exist — the unified server returns 404 cleanly and the consuming
  # page renders its no-data fallback. Move outputs into place as pipelines land.

  cross_species_manifests:
    path: "/mnt/e/results_cross_species/00_manifests"
    role: "intervals"
    species_scoped: false
    description: "Haplotype manifests for cross-species runs (18-genome + 5-hap Cgar/Cmac). TSV mapping species_id -> FASTA + divergence tier. Input to bp_atlas_pipeline + gene_order_consolidation."

  cross_species_bp_atlas:
    path: "/mnt/e/results_cross_species/01_bp_atlas"
    role: "intervals"
    species_scoped: false
    description: "wfmash BP_ATLAS pipeline outputs: passA/B PAFs (02_paf_passA/passB), raw + zoned breakpoints (03_breakpoints), reciprocity table, arc visualisation JSON (05_atlas_data), joint candidates (06_joint)."

  cross_species_consolidated:
    path: "/mnt/e/results_cross_species/02_consolidated"
    role: "intervals"
    species_scoped: false
    description: "Consolidated breakpoint clusters across method families. Includes breakpoint_clusters.tsv (cross-method validated headlines), pairwise_summary.tsv, and the tolerance_sweep subfolder."

  cross_species_gene_order:
    path: "/mnt/e/results_cross_species/03_gene_order"
    role: "intervals"
    species_scoped: false
    description: "BUSCO single-copy ortholog gene-order breakpoints (synteny_18sp_breakpoints.tsv, synteny_5sp_breakpoints.tsv). Independent method family to BP_ATLAS; used for Tier 1 cross-method validation."

  # 2026-05-29: roots added to close cross-species wiring gaps — these
  # five were referenced by cross-species layers.registry.json but had no
  # root definition, so the layers silently failed to resolve. Producer:
  # catfish-synteny-toolkit / MODULE_SYNTENY_ATLAS. Numbering continues
  # the 00..03 sequence above. See docs/DATA_LAYOUT.md for the per-layer
  # path_under_root breakdown.
  cross_species_te:
    path: "/mnt/e/results_cross_species/04_te"
    role: "intervals"
    species_scoped: false
    description: "Cross-species TE landscape tables: TE_data_figure1_toky_v2.tsv, combined_data_joined.tsv, te_gc.tsv, te_density_by_LG_species.tsv, plus per-focal breakpoint_te_cross/{focal_genome}/ enrichment + resolution tables and centromeres/centromeres_complete_{focal_short}.tsv."

  cross_species_mashmap:
    path: "/mnt/e/results_cross_species/05_mashmap"
    role: "intervals"
    species_scoped: false
    description: "mashmap fusion/fission scan: fusion_fission_candidates_1to2.tsv, best_refs_per_query.tsv, and per-request pair/{request_id}.json (some emitted as synthetic stubs on demand)."

  cross_species_breakpoint_genes:
    path: "/mnt/e/results_cross_species/06_breakpoint_genes"
    role: "intervals"
    species_scoped: false
    description: "Per-focal breakpoint gene-overlap tables: breakpoint_gene_analysis_{focal_genome}.tsv."

  cross_species_phylogeny:
    path: "/mnt/e/results_cross_species/07_phylogeny"
    role: "intervals"
    species_scoped: false
    description: "BUSCO phylogeny outputs: busco_tree_v1__{alignment}.json, busco_qc_v1.json, busco_presence_absence_v1.json."

  cross_species_inventory:
    path: "/mnt/e/results_cross_species/08_inventory"
    role: "intervals"
    species_scoped: false
    description: "Single-file run inventory (inventory_v1.json) enumerating what each cross-species pipeline produced."

  evolution_age_busco4d:
    path: "/mnt/e/results_evolution/01_age_busco_4d"
    role: "intervals"
    species_scoped: false
    description: "BUSCO 4D age estimation outputs (per-inversion molecular clock). Consumed by the age divergence page + age-model suggester."

  evolution_polarisation:
    path: "/mnt/e/results_evolution/02_polarisation"
    role: "intervals"
    species_scoped: false
    description: "Polarisation evidence per inversion: outgroup synteny vote tables + stacked-MSA founder consensus + doubleton SFS clusters. Read by polarize_synteny_vote.js and polarize_msa_stacked.js."

  evolution_haplotype_networks:
    path: "/mnt/e/results_evolution/03_haplotype_networks"
    role: "intervals"
    species_scoped: false
    description: "Per-inversion haplotype network JSONs. Used by the haplotype_network page (multi-genome list visualisation)."

  evolution_archaeology:
    path: "/mnt/e/results_evolution/04_archaeology"
    role: "intervals"
    species_scoped: false
    description: "Per-candidate archaeology synthesis cards (lineage + age + polarity + integrity verdict). Output of the archaeology_synthesis_card workflow."

  # 2026-05-29: referenced by an evolution layer but previously undeclared.
  evolution_orientation_diversity:
    path: "/mnt/e/results_evolution/05_orientation_diversity"
    role: "intervals"
    species_scoped: false
    description: "Per-candidate orientation-vs-diversity evidence (one {candidate_id}.json per inversion). Read by the evolution orientation/diversity page."

  popstats_groupwise:
    path: "/mnt/e/results_popstats/01_groupwise"
    role: "samples"
    species_scoped: false
    description: "Cohort-level group-wise statistics: pi, FST, dXY, HWE, F_IS, allele-frequency drift, private/fixed counts. Output of the popstats_groupwise + popstats_hobs_groupwise server operations."

  popstats_ancestry:
    path: "/mnt/e/results_popstats/02_ancestry_painting"
    role: "samples"
    species_scoped: false
    description: "Per-window ancestry painting + per-fish ancestry scrollers. Includes Q04 ancestry-Delta12 enrichment tracks consumed by inv_internal_substructure / fish_ancestry_scroller."

  heterozygosity_session:
    path: "/mnt/e/atlas-cache/heterozygosity/sessions"
    role: "results"
    writable: true
    description: "Session-level outputs from heterozygosity-atlas in-browser computes (currently: the f_roh_h_plane_v1 join). Lives under atlas-cache so it doesn't pollute the producer pipeline tree. Phase 1c (2026-05-23) split: read-only H data still comes from diversity_heterozygosity; only NEW heterozygosity-atlas derivations land here."

  # ----- writable evidence roots (Category 1, browser-writable) --------------

  candidates:
    path: "/mnt/e/atlas-cache/candidates"
    role: "evidence"
    description: "Per-candidate folders. WRITABLE - browser analysis modules persist here. Held in atlas-cache so the source tree stays clean."

  arrangement_calls:
    path: "/mnt/e/atlas-cache/arrangement_calls"
    role: "evidence"
    description: "Per-candidate per-version arrangement call outputs. WRITABLE."

  comparative:
    path: "/mnt/e/atlas-cache/comparative"
    role: "intervals"
    description: "Cross-species synteny / breakpoint reuse / phylogeny derived in-session."

  review_sessions:
    path: "/mnt/e/atlas-cache/review/{active_atlas}/sessions"
    role: "evidence"
    description: "Per-session review state (manual overrides, candidate decisions). WRITABLE; allowlisted in the server's POST /file handler."

  # ----- working dir + cache (Categories 2 + 3) ------------------------------

  working_dir:
    path: "/mnt/e/atlas-cache/working_dir"
    role: "results"
    description: "Persistent working directory for browser-side analysis outputs not tied to a candidate version."

  cache:
    path: "/mnt/e/atlas-cache"
    role: "results"
    writable: true
    ephemeral: true
    description: "Working cache for server compute results, browser-side intermediate computations, plus the writable evidence roots above. Layout: server_results/{op_id}/{hash}.json + free-form. SAFE TO DELETE (the writable evidence roots also live here - back them up elsewhere if you care about review state)."
    excluded_from_tarballs: true

# -----------------------------------------------------------------------------
# SERVER  (atlas_server.py)
# -----------------------------------------------------------------------------
server:

  bind:
    host: "127.0.0.1"
    port: 8000

  cors_origins:
    - "http://localhost:8000"
    - "http://127.0.0.1:8000"
    - "null"

  validation:
    min_group_n: 10

  popstats_cache:
    path: "/mnt/e/atlas-cache/popstats_engine_cache"
    max_bytes: 53687091200
    health_ttl_sec: 60

  dosage:
    max_region_bp: 50000000
    samples_file: null

# -----------------------------------------------------------------------------
# ENGINES — local compiled binaries (Windows / WSL).
# -----------------------------------------------------------------------------
engines:
  region_popstats: "/mnt/c/Users/quent/Desktop/bio_tools_quentin/bin/region_popstats"
  hobs_windower:   "/mnt/c/Users/quent/Desktop/bio_tools_quentin/bin/hobs_windower"
  angsd_patched:   "/mnt/c/Users/quent/Desktop/bio_tools_quentin/bin/angsd_fixed_HWE"
  instant_q:       "/mnt/c/Users/quent/Desktop/bio_tools_quentin/bin/instant_q"

# -----------------------------------------------------------------------------
# DEFAULTS
# -----------------------------------------------------------------------------
defaults:

  popstats:
    win_bp: 50000
    step_bp: 10000
    type: 2
    downsample: 1
    ncores: 4

  hobs:
    scales:
      - "5kb:5000:1000"
      - "10kb:10000:2000"
      - "50kb:50000:10000"
      - "100kb:100000:20000"
      - "250kb:250000:50000"
      - "500kb:500000:100000"
      - "1Mb:1000000:200000"

  angsd:
    threads: 2
    major_minor: 1
    min_maf: 0.05
    min_mapq: 20
    min_q: 20
    snp_pval: "1e-6"
    max_het_freq: 1.0
