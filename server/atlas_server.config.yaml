# =============================================================================
# atlas_server.config.yaml
# =============================================================================
# Site-local config for atlas_server. Mirrors the layout of
# unified_ancestry/00_ancestry_config.sh.
#
# 2026-05-26: this file used to ship with HPC `/scratch/lt200308-agbsci/...`
# paths copied from `atlas_server.config.example.yaml`. Replaced with the
# same local /mnt/e + /mnt/c paths that `atlas_server.local.yaml` uses,
# so anyone who points `--config` at this file gets a working setup
# out of the box.
#
# Workflow note:
#   - For day-to-day local dev, `start.sh` reads `.atlas.env` and picks
#     `atlas_server.local.yaml`. THAT is the canonical local config.
#   - This file exists so the documented `cp atlas_server.config.example.yaml
#     atlas_server.config.yaml ; ${EDITOR} atlas_server.config.yaml` flow
#     keeps working — site admins can copy the example and tweak.
#   - `atlas_server.config.example.yaml` still ships with /scratch paths
#     so it remains usable as the HPC-deployment template.
# =============================================================================

# ---- Server bind ------------------------------------------------------------
# Default port 8765 to avoid clashing with port 8000 used by start.sh.
bind:
  host: "127.0.0.1"
  port: 8765

# ---- Project anchors --------------------------------------------------------
base: "/mnt/e"
ref: "${base}/_shared/reference/fClaHyb_Gar_LG.fa"
ref_fai: "${base}/_shared/reference/fClaHyb_Gar_LG.fa.fai"

# ---- Engine binaries --------------------------------------------------------
# Compiled C binaries under bio_tools_quentin/bin (symlinks to the actual
# source trees). Each binary's SHA-256 is mixed into cache keys so a
# recompile automatically invalidates dependent cache entries.
engines:
  region_popstats: "/mnt/c/Users/quent/Desktop/bio_tools_quentin/bin/region_popstats"
  hobs_windower:   "/mnt/c/Users/quent/Desktop/bio_tools_quentin/bin/hobs_windower"
  angsd_patched:   "/mnt/c/Users/quent/Desktop/bio_tools_quentin/bin/angsd_fixed_HWE"
  instant_q:       "/mnt/c/Users/quent/Desktop/bio_tools_quentin/bin/instant_q"

# ---- Data inputs ------------------------------------------------------------
# Per-chrom BEAGLE imputed dosages (main_qcpass.<CHR>.beagle.gz).
beagle_dir: "${base}/results_inversions/01_beagle"

# Sample list (one ID per line, BAM-list-order — same order as BEAGLE columns).
sample_list: "${base}/_shared/samples.ind"

# Per-sample BAMs (used by Q07b ANGSD). Empty dir for now — Hobs/HWE
# endpoint will return 503 until populated. Replace with the real
# bam directory when needed.
bam_dir: "${base}/atlas-cache/empty_bams"
bam_suffix: "markdup.bam"

# Engine B (instant_q) per-window per-sample Q-matrix cache.
local_q_dir: "${base}/atlas-cache/empty_ancestry_cache"

# ---- Dosage heatmap bridge --------------------------------------------------
# Per-chromosome dosage store consumed by GET /api/dosage/chunk:
#   <dosage_dir>/<chrom>.sites.tsv.gz   marker  chrom  pos  allele1  allele2
#   <dosage_dir>/<chrom>.dosage.tsv.gz  marker  Ind0  Ind1  ...  (floats 0..2)
dosage_dir: "${base}/results_inversions/02_dosage_sites"
# 200 Mb covers every catfish chrom (longest is LG01 at ~51 Mb) with headroom.
dosage_max_region_bp: 200000000

# ---- Cache directory --------------------------------------------------------
cache_dir: "${base}/atlas-cache/popstats_server_cache"
cache_max_bytes: 53687091200    # 50 GB
cache_health_ttl_sec: 60

# ---- Server results cache (registry v2 persist contract) --------------------
server_results_cache_root: "${base}/atlas-cache/server_results"

# ---- Engine defaults --------------------------------------------------------
popstats_defaults:
  win_bp: 50000
  step_bp: 10000
  type: 2          # ANGSD-compatible fixed grid from chromosome position 0
  downsample: 1
  ncores: 4

hobs_defaults:
  scales:
    - "5kb:5000:1000"
    - "10kb:10000:2000"
    - "50kb:50000:10000"
    - "100kb:100000:20000"
    - "250kb:250000:50000"
    - "500kb:500000:100000"
    - "1Mb:1000000:200000"

angsd_defaults:
  threads: 2
  major_minor: 1
  min_maf: 0.05
  min_mapq: 20
  min_q: 20
  snp_pval: "1e-6"
  max_het_freq: 1.0

# ---- Validation -------------------------------------------------------------
min_group_n: 10

# ---- CORS -------------------------------------------------------------------
# Allow file:// + localhost origins. 8000 = start.sh default; 8765/8766 =
# legacy split-server ports.
cors_origins:
  - "http://localhost:8000"
  - "http://127.0.0.1:8000"
  - "http://localhost:8765"
  - "http://127.0.0.1:8765"
  - "http://localhost:8766"
  - "http://127.0.0.1:8766"
  - "null"           # file:// origin shows as "null" in CORS preflight
